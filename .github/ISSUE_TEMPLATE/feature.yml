name: Feature request
description: Suggest an enhancement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: markdown
    attributes:
      value: New Openlane tools must be verified against the official Go client. Do not propose wrapping arbitrary GraphQL mutations.
